name: Talker Android Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-offline
    paths:
      - "android/**"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK (Android debug signing)
        working-directory: android
        run: |
          gradle --no-daemon --stacktrace \
            -PtalkerVersionCode="${{ github.run_number }}" \
            -PtalkerVersionName="0.1.${{ github.run_number }}" \
            assembleDebug

      - name: Verify APK and package metadata
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 1
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: talker-android-test-v${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
