name: Talker Android Offline APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-offline
    paths:
      - "android/**"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Talker
        uses: actions/checkout@v5

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Checkout pinned audio.cpp inference engine
        run: |
          git clone --filter=blob:none https://github.com/0xShug0/audio.cpp.git third_party/audio.cpp
          cd third_party/audio.cpp
          git checkout f4e28c7bfb482b5b77c6017b35d4fe2f87bacc10
          git submodule update --init --recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build ARM64 debug APK with native inference engine
        working-directory: android
        run: |
          gradle --no-daemon --stacktrace \
            -PtalkerVersionCode="${{ github.run_number }}" \
            -PtalkerVersionName="1.0.${{ github.run_number }}" \
            assembleDebug

      - name: Verify APK and bundled native libraries
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 1
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/lib(audiocpp|talker_jni)\.so'
          unzip -p "$APK" lib/arm64-v8a/libtalker_jni.so >/dev/null
          unzip -p "$APK" lib/arm64-v8a/libaudiocpp.so >/dev/null
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload installable ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: talker-offline-arm64-v${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
