name: Talker Android Offline APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-offline
    paths:
      - "android/**"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Talker
        uses: actions/checkout@v5

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Checkout pinned audio.cpp inference engine
        run: |
          git clone --filter=blob:none https://github.com/0xShug0/audio.cpp.git third_party/audio.cpp
          cd third_party/audio.cpp
          git checkout f4e28c7bfb482b5b77c6017b35d4fe2f87bacc10
          git submodule update --init --recursive

      - name: Exclude desktop-only audio.cpp executables on Android
        run: python3 android/patch_audio_cpp_for_android.py

      - name: Build audio.cpp C API for Android arm64
        run: |
          cmake -S third_party/audio.cpp -B build/audio-android \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DAUDIOCPP_BUILD_C_API=ON \
            -DAUDIOCPP_MODEL_SET=custom \
            -DAUDIOCPP_MODELS=omnivoice \
            -DENGINE_ENABLE_OPENMP=OFF \
            -DGGML_OPENMP=OFF \
            -DENGINE_ENABLE_NATIVE_CPU=OFF \
            -DENGINE_ENABLE_CUDA=OFF \
            -DENGINE_ENABLE_HIP=OFF \
            -DENGINE_ENABLE_VULKAN=OFF \
            -DENGINE_ENABLE_METAL=OFF \
            -DENGINE_ENABLE_SYCL=OFF \
            -DENGINE_ENABLE_WEBGPU=OFF
          cmake --build build/audio-android --target audiocpp --parallel 2
          LIB=$(find build/audio-android -type f -name 'libaudiocpp.so' -print -quit)
          test -n "$LIB"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a android/app/src/main/cpp/include
          cp "$LIB" android/app/src/main/jniLibs/arm64-v8a/libaudiocpp.so
          cp third_party/audio.cpp/include/audiocpp.h android/app/src/main/cpp/include/audiocpp.h
          readelf -d "$LIB" | tee build/audio-android/libaudiocpp-needed.txt
          if readelf -d "$LIB" | grep -q 'libomp.so'; then
            echo "Unexpected unresolved libomp.so runtime dependency"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build ARM64 debug APK with native inference engine
        working-directory: android
        run: |
          gradle --no-daemon --stacktrace \
            -PtalkerVersionCode="${{ github.run_number }}" \
            -PtalkerVersionName="1.0.${{ github.run_number }}" \
            assembleDebug

      - name: Verify APK and bundled native libraries
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 1
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/lib(audiocpp|talker_jni)\.so'
          unzip -p "$APK" lib/arm64-v8a/libtalker_jni.so >/dev/null
          unzip -p "$APK" lib/arm64-v8a/libaudiocpp.so > /tmp/libaudiocpp.so
          readelf -d /tmp/libaudiocpp.so | tee /tmp/libaudiocpp-needed.txt
          if readelf -d /tmp/libaudiocpp.so | grep -q 'libomp.so'; then
            echo "APK contains libaudiocpp.so with missing libomp.so dependency"
            exit 1
          fi
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload installable ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: talker-offline-arm64-v${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
